<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Pushover Settings</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: sans-serif;
        margin: 20px;
        line-height: 1.5;
      }

      h2 {
        margin-top: 0;
      }

      .field {
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        font-size: 14px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
      }

      #status {
        margin-top: 18px;
        white-space: pre-wrap;
        font-size: 13px;
        padding: 12px;
        border-radius: 8px;
        background: rgba(127, 127, 127, 0.12);
      }

      .hint {
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h2>Pushover Settings</h2>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>

    <div class="field">
      <label for="deviceName">Device name</label>
      <input
        id="deviceName"
        type="text"
        maxlength="25"
        placeholder="my_pc"
      />
      <div class="hint">英数字 / _ / - 推奨、25文字以内</div>
    </div>

    <div class="field">
      <label for="twofa">2FA code (必要時のみ)</label>
      <input
        id="twofa"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
      />
    </div>

    <div class="actions">
      <button id="saveBtn">ログインして保存</button>
      <button id="loadBtn" type="button">保存済み設定を再読込</button>
    </div>

    <div id="status">準備完了</div>

    <script src="./settings.js"></script>
  </body>
</html>
